[package]
name = "ptyctl"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Keep interactive terminal sessions (REPLs, shells, kubectl exec -it) alive in the background and drive them from scripts or AI agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/orhanbalci/ptyctl"
readme = "README.md"
keywords = ["pty", "terminal", "repl", "automation", "agent"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.189"
portable-pty = "0.9.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strip-ansi-escapes = "0.2.1"

[dev-dependencies]
serde_json = "1.0.151"
